<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yomar Offline Karaoke — Offline Player</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#150a21">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg-void: #150a21;
    --bg-panel: #1f1033;
    --bg-card: #261741;
    --line: #3a234f;
    --accent-magenta: #ff2bd6;
    --accent-gold: #ffc857;
    --accent-cyan: #2be8ff;
    --text-primary: #f6eefc;
    --text-muted: #b6a3cf;
    --font-display: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-utility: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg-void);
    color: var(--text-primary);
    font-family: var(--font-body);
    -webkit-tap-highlight-color: transparent;
  }
  body{
    background-image:
      radial-gradient(circle at 15% 0%, rgba(255,43,214,0.12), transparent 45%),
      radial-gradient(circle at 85% 10%, rgba(43,232,255,0.10), transparent 40%);
  }
  button{ font-family: inherit; cursor:pointer; }
  input{ font-family: inherit; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline: 2px solid var(--accent-gold);
    outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }

  /* ---------- layout shell ---------- */
  .app{ min-height:100%; display:flex; flex-direction:column; }

  /* ---------- marquee header ---------- */
  .marquee{
    display:flex; align-items:center; gap:12px;
    padding: 10px 14px;
    background: linear-gradient(180deg, var(--bg-panel), var(--bg-void));
    border-bottom: 1px solid var(--line);
    position: sticky; top:0; z-index: 30;
  }
  .menu-btn{
    background: transparent; border: 1px solid var(--line); color: var(--text-primary);
    width: 40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .brand{
    display:flex; align-items:baseline; gap:6px; flex:1 1 auto; min-width:0;
  }
  .brand h1{
    font-family: var(--font-display);
    font-size: clamp(14px, 3.6vw, 24px);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin:0;
    color: var(--accent-magenta);
    text-shadow: 0 0 6px rgba(255,43,214,.9), 0 0 22px rgba(255,43,214,.45);
    line-height: 1.15;
  }
  .brand .dot{ color: var(--accent-gold); text-shadow: 0 0 10px rgba(255,200,87,.8); }

  /* ---------- dedicated search row (own row, big tap target) ---------- */
  .search-row{
    padding: 12px 14px;
    background: var(--bg-void);
    border-bottom: 1px solid var(--line);
  }
  .search-wrap{
    width:100%; max-width: 640px; margin: 0 auto;
    display:flex; align-items:center; gap:10px;
    background: var(--bg-card); border:1px solid var(--line); border-radius: 12px;
    padding: 0 14px; height: 50px;
  }
  .search-wrap svg{ flex-shrink:0; opacity:.7; }
  .search-wrap input{
    flex:1; min-width:0; background:transparent; border:none; color: var(--text-primary);
    font-size:16px; height:100%;
  }
  .search-wrap input::placeholder{ color: var(--text-muted); }
  .search-wrap input:focus{ outline:none; }
  .clear-search{
    background:none; border:none; color:var(--text-muted); font-size:20px; line-height:1; padding:6px;
  }
  .load-btn{
    flex-shrink:0;
    background: var(--accent-magenta); color:#1a0a16; border:none; border-radius:10px;
    padding: 0 14px; height:40px; font-weight:700; font-size:14px; white-space:nowrap;
  }
  .load-btn.secondary{
    background: transparent; color: var(--accent-gold); border:1px solid var(--accent-gold);
  }

  /* ---------- body / sidebar / content ---------- */
  .body-row{ flex:1; display:flex; min-height:0; }

  .sidebar{
    width: 230px; flex-shrink:0;
    background: var(--bg-panel);
    border-right: 1px solid var(--line);
    overflow-y:auto;
    padding: 12px 0 24px;
  }
  .sidebar h2{
    font-family: var(--font-utility);
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--text-muted); margin: 4px 16px 8px;
  }
  .folder-tab{
    width:100%; text-align:left; background:none; border:none; color: var(--text-primary);
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding: 10px 16px; font-size:14px; border-left: 3px solid transparent;
  }
  .folder-tab:hover{ background: rgba(255,255,255,0.04); }
  .folder-tab.active{
    border-left-color: var(--accent-magenta);
    background: rgba(255,43,214,0.10);
    color: var(--accent-gold);
    font-weight:600;
  }
  .folder-tab .count{
    font-family: var(--font-utility); font-size:12px; color: var(--text-muted);
    background: rgba(255,255,255,0.06); border-radius:8px; padding: 1px 7px; flex-shrink:0;
  }
  .folder-tab.active .count{ color: var(--accent-gold); }

  .sidebar-backdrop{ display:none; }

  .content{
    flex:1; min-width:0; overflow-y:auto;
    padding: 16px;
  }
  .content-head{
    display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:14px; flex-wrap:wrap;
  }
  .content-head h2{
    margin:0; font-size:18px; font-weight:700;
  }
  .content-head .sub{
    font-family: var(--font-utility); font-size:12px; color: var(--text-muted);
  }

  .empty-state{
    margin-top: 8vh; text-align:center; color: var(--text-muted); max-width:440px; margin-inline:auto;
  }
  .empty-state .mic{ font-size:46px; display:block; margin-bottom:10px; }
  .empty-state h3{ color: var(--text-primary); font-size:19px; margin: 0 0 8px; }
  .empty-state p{ font-size:14px; line-height:1.5; margin: 0 0 18px; }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 14px;
  }

  .card{
    position:relative;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 14px 12px;
    text-align:left;
    color: var(--text-primary);
    display:flex; flex-direction:column; gap:8px;
    min-height: 96px;
  }
  .card::before, .card::after{
    content:""; position:absolute; top:50%; width:14px; height:14px; background: var(--bg-void);
    border-radius:50%; transform: translateY(-50%);
  }
  .card::before{ left:-7px; }
  .card::after{ right:-7px; }
  .card .tear{
    border-top: 1px dashed var(--line); margin-top:auto; padding-top:8px;
    display:flex; align-items:center; justify-content:space-between; gap:6px;
  }
  .card .title{
    font-size:14px; font-weight:700; line-height:1.3;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .card .folder-tag{
    font-family: var(--font-utility); font-size:10.5px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing:.04em;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width: 70%;
  }
  .card .codec-badge{
    font-family: var(--font-utility); font-size:9.5px; color: var(--accent-gold);
    border:1px solid var(--accent-gold); border-radius:6px; padding:1px 5px; flex-shrink:0;
  }
  .card .play-pip{
    position:absolute; top:10px; right:10px; width:26px; height:26px; border-radius:50%;
    background: var(--accent-magenta); display:flex; align-items:center; justify-content:center;
  }
  .card:active{ transform: scale(0.98); }

  /* ---------- footer note ---------- */
  .offline-note{
    font-family: var(--font-utility); font-size:11px; color: var(--text-muted);
    text-align:center; padding: 10px; border-top:1px solid var(--line); background: var(--bg-panel);
  }
  .offline-note .ok{ color: var(--accent-cyan); }

  /* ---------- player overlay ---------- */
  .player-overlay{
    position:fixed; inset:0; background: #050208; z-index: 100;
    display:flex; flex-direction:column;
    transform: translateY(100%); transition: transform .25s ease;
  }
  .player-overlay.open{ transform: translateY(0); }
  .player-top{
    display:flex; align-items:center; gap:10px; padding: 12px 14px;
    background: linear-gradient(180deg, rgba(0,0,0,.6), transparent);
    position:absolute; top:0; left:0; right:0; z-index:2;
  }
  .player-top .close-btn{
    background: rgba(255,255,255,0.08); border:none; color:#fff; width:36px; height:36px;
    border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .player-top .now-playing{ min-width:0; flex:1; }
  .player-top .now-playing .label{ font-family: var(--font-utility); font-size:10px; color: var(--accent-cyan); text-transform:uppercase; letter-spacing:.1em; }
  .player-top .now-playing .title{ font-size:15px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .video-stage{
    flex:1; display:flex; align-items:center; justify-content:center; min-height:0; background:#000;
  }
  video{ width:100%; height:100%; max-height:100%; object-fit:contain; background:#000; }

  .player-bottom{
    display:flex; align-items:center; justify-content:center; gap:14px;
    padding: 14px; background: linear-gradient(0deg, rgba(0,0,0,.7), transparent);
    position:absolute; bottom:0; left:0; right:0;
  }
  .nav-btn{
    background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.18); color:#fff;
    border-radius: 999px; padding: 10px 18px; font-size:14px; font-weight:600;
    display:flex; align-items:center; gap:6px;
  }
  .nav-btn:disabled{ opacity:.35; }
  .autoplay-toggle{
    display:flex; align-items:center; gap:6px; color: var(--text-muted); font-size:12px;
    background: rgba(255,255,255,0.06); border-radius:999px; padding:8px 12px;
  }

  /* ---------- responsive: drawer sidebar on small screens ---------- */
  @media (max-width: 880px){
    .sidebar{
      position: fixed; top:0; left:0; bottom:0; z-index: 60; width: 260px;
      transform: translateX(-100%); transition: transform .22s ease;
      box-shadow: 8px 0 30px rgba(0,0,0,0.5);
    }
    .sidebar.open{ transform: translateX(0); }
    .sidebar-backdrop.open{
      display:block; position:fixed; inset:0; background: rgba(0,0,0,0.5); z-index:50;
    }
    .brand h1{ font-size: 13px; letter-spacing: 0.02em; }
    .load-btn{ padding: 0 10px; font-size:12.5px; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="marquee">
    <button class="menu-btn" id="menuBtn" aria-label="Toggle song folders">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="brand"><h1>Yomar<span class="dot">·</span>Offline Karaoke</h1></div>
    <button class="load-btn" id="loadBtn">Load Songs</button>
    <button class="load-btn secondary" id="addBtn" hidden>+ Add Folder</button>
  </header>

  <div class="search-row">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="text" id="searchInput" placeholder="Search songs or folders…">
      <button class="clear-search" id="clearSearch" aria-label="Clear search" hidden>✕</button>
    </div>
  </div>

  <div class="body-row">
    <div class="sidebar-backdrop" id="backdrop"></div>
    <aside class="sidebar" id="sidebar">
      <h2>Songbook</h2>
      <div id="folderList"></div>
    </aside>

    <main class="content">
      <div class="content-head" id="contentHead" hidden>
        <h2 id="contentTitle">All Songs</h2>
        <span class="sub" id="contentCount"></span>
      </div>
      <div class="empty-state" id="emptyState">
        <span class="mic">🎤</span>
        <h3>No songs loaded yet</h3>
        <p>Tap <strong>Load Songs</strong> and pick the karaoke folder on your microSD card or USB drive. Everything plays straight from local storage — no internet needed, ever.</p>
        <button class="load-btn" id="emptyLoadBtn">Load Songs</button>
      </div>
      <div class="grid" id="grid"></div>
    </main>
  </div>

  <div class="offline-note"><span class="ok">●</span> Runs fully offline — files never leave this device</div>
</div>

<input type="file" id="folderInput" webkitdirectory directory multiple hidden>

<div class="player-overlay" id="playerOverlay">
  <div class="player-top">
    <button class="close-btn" id="closePlayer" aria-label="Close player">✕</button>
    <div class="now-playing">
      <div class="label">Now Singing</div>
      <div class="title" id="nowTitle">—</div>
    </div>
  </div>
  <div class="video-stage">
    <video id="videoEl" controls playsinline></video>
  </div>
  <div class="player-bottom">
    <button class="nav-btn" id="prevBtn">⏮ Prev</button>
    <label class="autoplay-toggle"><input type="checkbox" id="autoplayChk"> Autoplay next</label>
    <button class="nav-btn" id="nextBtn">Next ⏭</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var VIDEO_RE = /\.(mp4|m4v|mov|webm|mkv|avi|3gp|ogv)$/i;
  var library = [];        // {file, path, name, folderTop, folderPath, ext}
  var seenPaths = new Set();
  var folderCounts = new Map();
  var activeFolder = null; // null = All Songs
  var searchTerm = "";
  var currentQueue = [];
  var currentIndex = -1;
  var currentObjectUrl = null;

  var folderInput = document.getElementById('folderInput');
  var loadBtn = document.getElementById('loadBtn');
  var addBtn = document.getElementById('addBtn');
  var emptyLoadBtn = document.getElementById('emptyLoadBtn');
  var emptyState = document.getElementById('emptyState');
  var contentHead = document.getElementById('contentHead');
  var contentTitle = document.getElementById('contentTitle');
  var contentCount = document.getElementById('contentCount');
  var grid = document.getElementById('grid');
  var folderListEl = document.getElementById('folderList');
  var searchInput = document.getElementById('searchInput');
  var clearSearch = document.getElementById('clearSearch');
  var sidebar = document.getElementById('sidebar');
  var backdrop = document.getElementById('backdrop');
  var menuBtn = document.getElementById('menuBtn');

  var playerOverlay = document.getElementById('playerOverlay');
  var videoEl = document.getElementById('videoEl');
  var nowTitle = document.getElementById('nowTitle');
  var closePlayer = document.getElementById('closePlayer');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var autoplayChk = document.getElementById('autoplayChk');

  if (!('webkitdirectory' in document.createElement('input'))) {
    loadBtn.textContent = "Browser not supported";
    loadBtn.disabled = true;
    emptyState.querySelector('p').textContent =
      "This browser can't open whole folders. Please use Chrome (or Samsung Internet) on Android.";
  }

  try { autoplayChk.checked = localStorage.getItem('pk_autoplay') !== '0'; }
  catch(e){ autoplayChk.checked = true; }
  autoplayChk.addEventListener('change', function(){
    try { localStorage.setItem('pk_autoplay', autoplayChk.checked ? '1' : '0'); } catch(e){}
  });

  function cleanTitle(filename){
    var n = filename.replace(VIDEO_RE, '');
    n = n.replace(/^[\s_\-\.]*\d{1,3}[\s_\-\.]+/, ''); // strip leading track numbers
    n = n.replace(/[_]+/g, ' ').trim();
    return n || filename;
  }

  function addFiles(fileList){
    var added = 0;
    for (var i = 0; i < fileList.length; i++){
      var f = fileList[i];
      var rel = f.webkitRelativePath || f.name;
      if (!VIDEO_RE.test(f.name)) continue;
      if (seenPaths.has(rel)) continue;
      seenPaths.add(rel);

      var parts = rel.split('/');
      var folderTop = parts.length >= 3 ? parts[1] : 'Other';
      var folderPath = parts.slice(1, -1).join(' / ') || folderTop;
      var ext = (f.name.match(VIDEO_RE) || [''])[0].slice(1).toUpperCase();

      library.push({
        file: f, path: rel, name: cleanTitle(f.name),
        folderTop: folderTop, folderPath: folderPath, ext: ext
      });
      folderCounts.set(folderTop, (folderCounts.get(folderTop) || 0) + 1);
      added++;
    }
    library.sort(function(a, b){ return a.name.localeCompare(b.name); });
    return added;
  }

  function openPicker(){ folderInput.click(); }
  loadBtn.addEventListener('click', openPicker);
  emptyLoadBtn.addEventListener('click', openPicker);
  addBtn.addEventListener('click', openPicker);

  folderInput.addEventListener('change', function(){
    var added = addFiles(folderInput.files);
    folderInput.value = "";
    if (library.length === 0){
      alert("No playable video files were found in that folder. Looking for .mp4, .mkv, .webm, .mov, .avi files.");
      return;
    }
    emptyState.hidden = true;
    contentHead.hidden = false;
    addBtn.hidden = false;
    loadBtn.textContent = "Change Folder";
    renderFolderList();
    renderGrid();
  });

  function renderFolderList(){
    var html = '<button class="folder-tab' + (activeFolder === null ? ' active' : '') + '" data-folder="">' +
      '<span>All Songs</span><span class="count">' + library.length + '</span></button>';
    var names = Array.from(folderCounts.keys()).sort(function(a,b){ return a.localeCompare(b); });
    names.forEach(function(name){
      html += '<button class="folder-tab' + (activeFolder === name ? ' active' : '') + '" data-folder="' + escapeAttr(name) + '">' +
        '<span>' + escapeHtml(name) + '</span><span class="count">' + folderCounts.get(name) + '</span></button>';
    });
    folderListEl.innerHTML = html;
    Array.prototype.forEach.call(folderListEl.querySelectorAll('.folder-tab'), function(btn){
      btn.addEventListener('click', function(){
        activeFolder = btn.getAttribute('data-folder') || null;
        renderFolderList();
        renderGrid();
        closeSidebarOnMobile();
      });
    });
  }

  function currentFiltered(){
    var term = searchTerm.trim().toLowerCase();
    return library.filter(function(item){
      if (activeFolder !== null && item.folderTop !== activeFolder) return false;
      if (!term) return true;
      return item.name.toLowerCase().indexOf(term) !== -1 ||
             item.folderPath.toLowerCase().indexOf(term) !== -1;
    });
  }

  function renderGrid(){
    var list = currentFiltered();
    contentTitle.textContent = activeFolder === null ? "All Songs" : activeFolder;
    contentCount.textContent = list.length + (list.length === 1 ? " song" : " songs");

    if (list.length === 0){
      grid.innerHTML = '<p style="color:var(--text-muted);grid-column:1/-1;">No songs match. Try a different search or folder.</p>';
      return;
    }
    var html = '';
    list.forEach(function(item, idx){
      html += '<button class="card" data-idx="' + idx + '">' +
        '<span class="play-pip">▶</span>' +
        '<span class="title">' + escapeHtml(item.name) + '</span>' +
        '<span class="tear">' +
          '<span class="folder-tag">' + escapeHtml(item.folderPath) + '</span>' +
          '<span class="codec-badge">' + item.ext + '</span>' +
        '</span></button>';
    });
    grid.innerHTML = html;
    Array.prototype.forEach.call(grid.querySelectorAll('.card'), function(card){
      card.addEventListener('click', function(){
        var idx = parseInt(card.getAttribute('data-idx'), 10);
        currentQueue = list;
        playAt(idx);
      });
    });
  }

  function playAt(idx){
    if (idx < 0 || idx >= currentQueue.length) return;
    currentIndex = idx;
    var item = currentQueue[idx];
    if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
    currentObjectUrl = URL.createObjectURL(item.file);
    videoEl.src = currentObjectUrl;
    nowTitle.textContent = item.name;
    prevBtn.disabled = idx <= 0;
    nextBtn.disabled = idx >= currentQueue.length - 1;
    playerOverlay.classList.add('open');
    videoEl.play().catch(function(){});
  }

  prevBtn.addEventListener('click', function(){ playAt(currentIndex - 1); });
  nextBtn.addEventListener('click', function(){ playAt(currentIndex + 1); });
  videoEl.addEventListener('ended', function(){
    if (autoplayChk.checked && currentIndex < currentQueue.length - 1){
      playAt(currentIndex + 1);
    }
  });
  closePlayer.addEventListener('click', function(){
    playerOverlay.classList.remove('open');
    videoEl.pause();
    videoEl.removeAttribute('src');
    videoEl.load();
    if (currentObjectUrl) { URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null; }
  });

  searchInput.addEventListener('input', function(){
    searchTerm = searchInput.value;
    clearSearch.hidden = !searchTerm;
    renderGrid();
  });
  clearSearch.addEventListener('click', function(){
    searchInput.value = ""; searchTerm = ""; clearSearch.hidden = true; renderGrid();
  });

  menuBtn.addEventListener('click', function(){
    sidebar.classList.toggle('open');
    backdrop.classList.toggle('open');
  });
  backdrop.addEventListener('click', closeSidebarOnMobile);
  function closeSidebarOnMobile(){
    sidebar.classList.remove('open');
    backdrop.classList.remove('open');
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }
  function escapeAttr(s){ return escapeHtml(s); }

  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }

})();
</script>
</body>
</html>
